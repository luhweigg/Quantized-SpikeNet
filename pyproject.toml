[project]
name = "quantized-spikenet"
version = "0.1.0"
description = "Training of spiking neural networks on event-based datasets and evaluation of their accuracy and energy on SpiNNaker."
readme = "README.md"
requires-python = ">=3.12, <3.14"
dependencies = [
    "aedat>=2.2.0",
    "h5py>=3.16.0",
    "imageio>=2.37.4",
    "pandas<3.0.0",
    "pynn>=0.13.0",
    "spikingjelly>=0.0.0.0.14",
    "spynnaker>=1!7.4.1",
    "tonic>=1.6.0",
    "wandb>=0.28.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:torch.*",
    "ignore::SyntaxWarning:spikingjelly.*",
    "ignore::SyntaxWarning:tonic.*"
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.15.20",
]
